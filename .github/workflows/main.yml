steps:
      - name: GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: castlelli
          template: classic
          base: header, activity, repositories
          base_indepth: yes
          plugin_lines: yes
          plugin_followup: yes
          config_display: regular
          config_timezone: America/Sao_Paulo