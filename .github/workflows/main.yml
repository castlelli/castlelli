- uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: castlelli
          template: classic
          base: header, activity, repositories # Removeu 'community' e 'metadata' para evitar info privada
          base_indepth: yes
          plugin_lines: yes # Mantém o "Lines of code changed" que você gostou
          plugin_followup: yes # Mantém "Repositories with contributions"
          config_display: regular # Deixa o layout mais limpo
