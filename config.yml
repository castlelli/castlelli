# Theme color overrides
# "TOXIC GALAXY" PALETTE - Industrial Sci-Fi
theme:
  void: "#050608" # Base: Deep Space Black (Mais escuro que o Carbono original para contraste)
  nebula: "#0B0C10" # Cards: Carbono Industrial (Sua cor base original)
  star_dust: "#1F2833" # Borders: Aço Escuro

  # Galactic Industrial Accents:
  axon_amber: "#D4FF00" # Acid Green (Sua Identidade Principal - Toxic)
  dendrite_violet: "#BD00FF" # Plasma Purple (Substitui o vermelho - Vibe Galáctica)
  synapse_cyan: "#00F0FF" # Electric Cyan (Tecnologia/Frio Industrial)
  white: "#F2F2F2"

  # Text Colors
  text_bright: "#E3E4E6" # Texto: Aço Escovado (Legibilidade Industrial)
  text_dim: "#8892b0" # Texto Secundário: Cinza Azulado (Espacial)
  text_faint: "#45A29E" # Labels: Cianeto Oxidado

# Stats configuration
stats:
  metrics:
    - "commits"
    - "stars"
    - "prs"
    - "issues"
    - "repos"

# Language display settings
languages:
  exclude:
    - "HTML"
    - "CSS"
    - "Shell"
    - "Makefile"
  max_display: 8
